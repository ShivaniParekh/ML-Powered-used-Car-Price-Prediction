<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Used Car Price Prediction</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}?v=1.1">
</head>

<body>

    <div class="text-light">
        <form action="{{ url_for('predict')}}" method="post">
            <h2>🚗 ML-Powered used Car Price Prediction</h2>
            
        <div class="form-grid-container">
            
            <div class="form-column">
            <h3>Purchase Year</h3>
            <input id="first" name="Year" type="number">

            <h3>Showroom Price (in lakhs)</h3>
            <input id="second" name="Present_Price" required="required">

            <h3>Kilometers Driven</h3>
            <input id="third" name="Kms_Driven" required="required">

            <h3>Previous Owners (0 / 1 / 3)</h3>
            <input id="fourth" name="Owner" type="number" required="required">
            </div>

            <div class="form-column">
            <h3>Fuel Type</h3>
            <select name="Fuel_Type_Petrol" id="fuel" required="required">
                <option value="Petrol">Petrol</option>
                <option value="Diesel">Diesel</option>
                    <option value="CNG">CNG</option> </select>

            <h3>Seller Type</h3>
            <select name="Seller_Type_Individual" id="resea" required="required">
                <option value="Dealer">Dealer</option>
                <option value="Individual">Individual</option>
            </select>

            <h3>Transmission type</h3>
            <select name="Transmission_Mannual" id="research" required="required">
                <option value="Mannual">Manual Car</option>
                <option value="Automatic">Automatic Car</option>
            </select>
            </div>
            
            <div class="button-container">
                <button id="sub" type="submit">Calculate the Selling Price</button>
            </div>
            
        </div>
        </form>
    
        {% if prediction_text %}
        <div id="prediction-result">
            {{ prediction_text }}
        </div>
        {% endif %}
    </div>

</body>

</html>
